[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketflow-lakehouse"
version = "1.0.0"
description = "Real-Time Market Data Lakehouse & AI Intelligence Engine using Polars, DuckDB, FastAPI, and Machine Learning"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Praveen Tripathi", email = "praveen@straddleedge.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial :: Investment",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=5"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
